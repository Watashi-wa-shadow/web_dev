<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="money.css">
    <title>Money Convereter</title>
</head>
<body>
    
    <div class="container">

        <h1>Currency Converter</h1>
        <p class="subtitle">Convert your money into another currency</p>

        <div class="converter">

            <div class="input-group">
                <label for="amount">Amount</label>
                <input type="number" id="amount" placeholder="Enter amount">
            </div>

            <div class="currency-section">

                <div class="currency-box">
                    <label for="fromCurrency">From</label>
                    <select id="fromCurrency">
                        <!-- <option value="USD">USD</option>
                        <option value="EUR">EUR</option>
                        <option value="GBP">GBP</option>
                        <option value="INR">INR</option>
                        <option value="JPY">JPY</option> -->
                    </select>
                </div>

                <button id="swapButton" class="swap-button">
                    ⇄
                </button>

                <div class="currency-box">
                    <label for="toCurrency">To</label>
                    <select id="toCurrency">
                        <!-- <option value="INR">INR</option>
                        <option value="USD">USD</option>
                        <option value="EUR">EUR</option>
                        <option value="GBP">GBP</option>
                        <option value="JPY">JPY</option> -->
                    </select>
                </div>

            </div>

            <button id="convertButton" class="convert-button">
                Convert
            </button>

            <div class="result">
                <p id="resultText">Converted amount will appear here</p>
            </div>

        </div>

    </div>

    <script src="money.js"></script>
</body>
</html>
